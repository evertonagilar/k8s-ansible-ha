---
- name: Variáveis utilizadas para provisionar fluentd
  debug:
    msg:
      - "ansible_host = {{ ansible_host }}"
      - "ansible_hostname = {{ ansible_hostname }}"

- name: Criar namespace namespace efk-logging
  kubernetes.core.k8s:
    name: efk-logging
    api_version: v1
    kind: Namespace
    state: present

- name: Copiar a pasta templates/base para {{ ansible_hostname }}
  copy:
    src: templates/base
    dest: /tmp/fluentd/templates
    remote_src: no

- name: Kustomizar o manifesto fluentd a partir dos templates
  shell: kubectl kustomize /tmp/fluentd/templates/base > /tmp/fluentd/templates/fluentd.yaml

- name: Copiar o manifesto gerado de volta para o projeto
  fetch:
    src: /tmp/fluentd/templates/fluentd.yaml
    dest: ./roles/fluentd/templates/fluentd.yaml
    flat: yes

- name: Provisionar fluentd log collector
  kubernetes.core.k8s:
    template: fluentd.yaml
    state: present
    force: yes   # Ansible doc: If set to yes, and state is present, an existing object will be replaced.
    wait: yes
    wait_timeout: 300
