<source>
  @type tail
  @id ${ENV}-sieweb
  path /var/log/containers/${ENV}-sieweb-*_${ENV}-sieweb_sieweb-*.log
  pos_file /var/log/fluentd.${ENV}-sieweb.log.pos
  tag ${ENV}-sieweb
  read_from_head false
  format /^(?<timestamp>[^\s]+) (?<stream>stdout|stderr) F (?<JSON>.*)$/
</source>
<filter ${ENV}-sieweb>
  @type grep
  <parse>
      @type json
  </parse>
  <exclude>
    key $.MethodName
    pattern /processRequest|processDispatchResult|resetContextHolders|getHandlerAdapter|doDispatch|getHandler|initContextHolders|render/
  </exclude>
  <exclude>
    key $.LogMessage
    pattern /^\s*$/
  </exclude>
</filter>
<filter ${ENV}-sieweb>
    @type record_transformer
    enable_ruby true
    <record>
      lower_message ${record["LogMessage"].downcase}
    </record>
</filter>
<filter ${ENV}-sieweb>
    @type record_transformer
    enable_ruby true
    <record>
      sie_db_error_conn ${!record["LogMessage"].nil? && record["LogMessage"].include?("ERRORCODE=-4499") ? true : false}
      sie_db_error ${!record["LogMessage"].nil? && (record["LogMessage"].include?("ERRORCODE=") || record["LoggerName"] == "org.hibernate.engine.jdbc.spi.SqlExceptionHelper") ? true : false}

      # Check for SQL-related logs
      sie_dml ${record["LoggerName"] == "org.hibernate.SQL" && !record["LogMessage"].nil? ? true : false}
      sie_dml_insert ${record["LoggerName"] == "org.hibernate.SQL" && record["lower_message"].start_with?("insert into") ? true : false}
      sie_dml_delete ${record["LoggerName"] == "org.hibernate.SQL" && record["lower_message"].start_with?("delete from") ? true : false}
      sie_dml_select ${record["LoggerName"] == "org.hibernate.SQL" && record["lower_message"].start_with?("select") ? true : false}
      sie_dml_update ${record["LoggerName"] == "org.hibernate.SQL" && record["lower_message"].start_with?("update") ? true : false}

      # Check for specific errors
      sie_error_email ${!record["LogMessage"].nil? && record["LogMessage"].include?("MailConnectException") ? true : false}
      sie_error_net ${!record["LogMessage"].nil? && record["LogMessage"].include?("ConnectException") ? true : false}
      sie_error_textsearch ${!record["LogMessage"].nil? && record["LogMessage"].include?("SQLCODE=-20423") ? true : false}
      sie_error_ejb ${!record["LogMessage"].nil? && (record["LogMessage"].include?("javax.ejb.") || record["LogMessage"].include?("org.omg.") || record["MessageID"] == "AS-EJB-00056") ? true : false}
      sie_error_sqltimeout ${!record["LogMessage"].nil? && record["LogMessage"].include?("SQLCODE=-952") ? true : false}
      sie_error_timeout ${record["lower_message"].include?("timeout") ? true : false}
      sie_error_constraint ${!record["LogMessage"].nil? && (record["LogMessage"].include?("SQLCODE=-803") || record["LogMessage"].include?("ConstraintViolationException")) ? true : false}
      sie_error_npe ${!record["LogMessage"].nil? && record["LogMessage"].include?("NullPointerException") ? true : false}

      # Check for hints
      sie_slow_hint ${!record["LogMessage"].nil? && record["LogMessage"].include?("[PERFORMANCE] ") ? true : false}

      # Check for bean-related logs
      sie_bean_timer ${record["LoggerName"] && record["LoggerName"].end_with?("TimerBean") ? true : false}
      sie_bean_service ${record["LoggerName"] && record["LoggerName"].end_with?("ServiceBean") ? true : false}
      sie_bean_interceptor ${record["LoggerName"] && record["LoggerName"].end_with?("Interceptor") ? true : false}
      sie_bean_filter ${record["LoggerName"] && record["LoggerName"].end_with?("FilterBean") ? true : false}
      sie_dwr_ajax ${record["LoggerName"] && record["LoggerName"] == "org.directwebremoting.impl.DefaultRemoter" ? true : false}

      # Extrair verbo HTTP e URI
      sie_req_uri ${!record["MethodName"].nil? && record["MethodName"] == "doService" && record["LogMessage"] =~ /processing (GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH) request for \[(.*?)\]/ ? $2 : nil}
      sie_req_verb ${!record["MethodName"].nil? && record["MethodName"] == "doService" &&record["LogMessage"] =~ /processing (GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH) request for \[(.*?)\]/ ? $1 : nil}
    </record>
</filter>
<filter ${ENV}-sieweb>
    @type record_transformer
    enable_ruby true
    <record>
      sie_req_portal ${record["sie_req_uri"].nil? ? nil : (record["sie_req_uri"] =~ /^\/(\w+)/ ? $1 : nil)}
    </record>
</filter>
<filter ${ENV}-sieweb>
  @type record_transformer
  remove_keys lower_message
</filter>
<match ${ENV}-sieweb>
    @type elasticsearch
    @id out_es_${ENV}_sieweb
    @log_level info
    include_tag_key false
    host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
    port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
    path ''
    user "#{ENV['FLUENT_ELASTICSEARCH_USER'] || ''}"
    password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD'] || ''}"
    scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME'] || 'http'}"
    ssl_verify "#{ENV['FLUENT_ELASTICSEARCH_SSL_VERIFY'] || 'true'}"
    ssl_version "#{ENV['FLUENT_ELASTICSEARCH_SSL_VERSION'] || 'TLSv1_2'}"
    reload_connections 'false'
    reconnect_on_error 'true'
    reload_on_failure 'true'
    logstash_prefix '${ENV}-sieweb'
    logstash_format 'true'
    index_name '${ENV}-sieweb'
    type_name 'fluentd'
    <buffer>
     flush_thread_count '8'
     flush_interval '5s'
     chunk_limit_size '2M'
     queue_limit_length '32'
     retry_max_interval '30'
     retry_forever 'true'
    </buffer>
</match>
