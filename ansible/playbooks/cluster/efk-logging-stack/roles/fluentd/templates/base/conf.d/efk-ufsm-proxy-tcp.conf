<source>
  @type tail
  @id proxy-tcp
  path /var/log/containers/proxy-tcp-*.log
  pos_file /var/log/fluentd.proxy-tcp.log.pos
  tag proxy-tcp
  read_from_head false
  # exemplo: 2024-09-06T07:56:30.888846087-03:00 stdout F 200.18.32.7:31962 [06/Sep/2024:10:53:40.235] proxy443 backend443/server1 1/1/170652 6419 -- 1/1/0/0/0 0/0
  format /^(?<timestamp>[^\s]+) (?<stream>stdout|stderr) F (?<source_ip>[^\:]+):(?<source_port>[^\s]+) \[(?<timestamp2>[^\]]+)\] (?<proxy>\S+) (?<backend>\S+) (?<info>.*)$/
</source>
<match proxy-tcp>
    @type elasticsearch
    @id out_es_proxy_tcp
    @log_level info
    include_tag_key false
    remove_keys timestamp2
    host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
    port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
    path ''
    user "#{ENV['FLUENT_ELASTICSEARCH_USER'] || ''}"
    password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD'] || ''}"
    scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME'] || 'http'}"
    ssl_verify "#{ENV['FLUENT_ELASTICSEARCH_SSL_VERIFY'] || 'true'}"
    ssl_version "#{ENV['FLUENT_ELASTICSEARCH_SSL_VERSION'] || 'TLSv1_2'}"
    reload_connections 'false'
    reconnect_on_error 'true'
    reload_on_failure 'true'
    log_es_400_reason 'true'
    logstash_prefix 'proxy-tcp'
    logstash_format 'true'
    index_name 'proxy-tcp'
    type_name 'fluentd'
    <buffer>
     flush_thread_count '8'
     flush_interval '5s'
     chunk_limit_size '2M'
     queue_limit_length '32'
     retry_max_interval '30'
     retry_forever 'true'
    </buffer>
</match>
