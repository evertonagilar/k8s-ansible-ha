apiVersion: v1
kind: PersistentVolume
metadata:
  # não declarar namespace, pois PV eh global!
  name: elasticsearch-data-pv
spec:
  capacity:
    storage: 300Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: "{{ EFK_LOGGING.elasticsearch.volumePath }}"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "{{ EFK_LOGGING.elasticsearch.nodeName }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-pvc
  namespace: efk-logging
spec:
  storageClassName: local-storage
  volumeName: elasticsearch-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi
