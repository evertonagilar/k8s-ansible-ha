apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-loadbalancer
spec:
  selector:
    matchLabels:
      app: k8s-loadbalancer
  template:
    metadata:
      labels:
        app: k8s-loadbalancer
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: haproxy:3.0.0-alpine
          name: k8s-loadbalancer
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 60
            failureThreshold: 8
          volumeMounts:
            - mountPath: /usr/local/etc/haproxy/haproxy.cfg
              name: haproxy-config
              subPath: haproxy.cfg
              readOnly: true
            - name: whitelist
              mountPath: /whitelist
              readOnly: true
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
        - name: whitelist
          configMap:
            name: whitelist



