---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: cpd-suporte-default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: cpd-suporte-default-binding
subjects:
  - kind: User
    name: "{{ CLUSTER_ADMIN.username }}"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: dads
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cpd-suporte-default
  apiGroup: rbac.authorization.k8s.io

