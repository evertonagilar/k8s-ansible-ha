---
- name: Mostrar variáveis para provisionar k8s-software
  debug:
    msg:
    - "ansible_host = {{ ansible_host }}"
    - "ansible_hostname = {{ ansible_hostname }}"
    - "VM_K8S_VERSION = {{ VM_K8S_VERSION }}"
    - "VM_K8S_REPO = {{ VM_K8S_REPO }}"

- name: Adicionar chave APT do Kubernetes
  apt_key:
    url: "https://pkgs.k8s.io/core:/stable:/{{ VM_K8S_REPO }}/deb/Release.key"
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present

- name: Adicionar repositório APT do Kubernetes
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ VM_K8S_REPO }}/deb/ /"
    filename: kubernetes
    update_cache: yes

- name: Verificar versão atual do kubeadm
  shell: dpkg-query -W -f='${Version}' kubeadm || true
  register: kubeadm_version
  changed_when: false

- name: Verificar versão atual do kubelet
  shell: dpkg-query -W -f='${Version}' kubelet || true
  register: kubelet_version
  changed_when: false

- name: Verificar versão atual do kubectl
  shell: dpkg-query -W -f='${Version}' kubectl || true
  register: kubectl_version
  changed_when: false

- name: Definir se a instalação é necessária
  set_fact:
    instalar_k8s: "{{ kubeadm_version.stdout != VM_K8S_VERSION or kubelet_version.stdout != VM_K8S_VERSION or kubectl_version.stdout != VM_K8S_VERSION }}"

- name: Desbloquear pacotes kubeadm, kubelet e kubectl (unhold)
  dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
  - kubeadm
  - kubelet
  - kubectl
  when: instalar_k8s
  ignore_errors: true

- name: Instalar kubeadm, kubelet e kubectl (versão exata)
  apt:
    pkg:
    - "kubeadm={{ VM_K8S_VERSION }}"
    - "kubectl={{ VM_K8S_VERSION }}"
    - "kubelet={{ VM_K8S_VERSION }}"
    state: present
  when: instalar_k8s

- name: Bloquear pacotes kubeadm, kubelet e kubectl (hold)
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
  - kubeadm
  - kubelet
  - kubectl
  when: instalar_k8s
