---
- name: Variáveis utilizadas para instalar csi-driver-nfs
  debug:
    msg:
      - "VM_CSI_DRIVER_NFS_VERSION = {{ VM_CSI_DRIVER_NFS_VERSION }}"

- name: Adicionar repositório csi-driver-nfs
  kubernetes.core.helm_repository:
    name: csi-driver-nfs
    repo_url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts

- name: Provisionar o csi-driver-nfs no Kubernetes
  kubernetes.core.helm:
    name: csi-driver-nfs
    chart_ref: csi-driver-nfs/csi-driver-nfs
    namespace: kube-system
    chart_version: "{{ VM_CSI_DRIVER_NFS_VERSION }}"
    values: {}

- name: Aguardar csi-driver-nfs ficar pronto
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait -n kube-system --timeout=300s --for=condition=Available deploy/csi-nfs-controller
  args:
    executable: /bin/bash
