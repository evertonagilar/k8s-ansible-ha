---
- name: Variáveis utilizadas para provisionar redis
  debug:
    msg:
      - "ansible_host = {{ ansible_host }}"
      - "ansible_hostname = {{ ansible_hostname }}"
      - "NAMESPACE = {{ NAMESPACE }}"
      - "NOME_APP = {{ NOME_APP }}"
      - "OVERLAY_PATH = {{ OVERLAY_PATH }}"
      - "REPO_SIEWEB_REDIS.repo = {{ REPO_SIEWEB_REDIS.repo }}"
      - "REPO_SIEWEB_REDIS.sync_policy = {{ REPO_SIEWEB_REDIS.sync_policy }}"
      - "REPO_SIEWEB_REDIS.revision = {{ REPO_SIEWEB_REDIS.revision }}"
      - "REPO_SIEWEB_REDIS.dest_server = {{ REPO_SIEWEB_REDIS.dest_server }}"

- name: Verificando se app/{{ NOME_APP }} já está provisionado no ArgoCD
  shell: kubectl -n argocd get app/{{ NOME_APP }} --ignore-not-found
  register: existe_app

- name: Registrando {{ NOME_APP }} no ArgoCD
  shell: argocd app create {{ NOME_APP }}  --repo {{ REPO_SIEWEB_REDIS.repo }} --path {{ OVERLAY_PATH }} --dest-server {{ REPO_SIEWEB_REDIS.dest_server }} --dest-namespace {{ NAMESPACE }} --sync-policy {{ REPO_SIEWEB_REDIS.sync_policy }} --revision {{ REPO_SIEWEB_REDIS.revision }}
  when: existe_app.stdout == ""

